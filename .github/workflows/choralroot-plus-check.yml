name: ChoralRoot Plus emulator build check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow==11.1.0 fonttools==4.66.1 uharfbuzz
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - name: Generate firmware headers
        run: python tools/build.py
      - name: Build browser firmware
        run: sh tools/emu/web/build_web.sh
      - name: Upload browser preview for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choralroot-plus-web
          path: build/emu-web/
          if-no-files-found: ignore
